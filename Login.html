<!DOCTYPE html>
<html>

<head>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-sync.js"></script>


<title>TODA System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

height:100vh;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

color:white;

background:
radial-gradient(circle at top,#064437,#07131c 45%,#020609);

}


/* HYDROGEN ORBITS */

.atom{

position:absolute;

width:350px;
height:350px;

border-radius:50%;

border:1px solid rgba(0,255,170,.25);

animation:rotate 12s linear infinite;

}



.atom:before{

content:"";

position:absolute;

width:15px;
height:15px;

background:#00ffae;

border-radius:50%;

top:20px;
left:50%;

box-shadow:
0 0 20px #00ffae,
0 0 50px #00ffae;

}



.atom.two{

width:520px;
height:520px;

opacity:.4;

animation-direction:reverse;

}



@keyframes rotate{

from{
transform:rotate(0);
}

to{
transform:rotate(360deg);
}

}




/* PARTICLES */


.particle{

position:absolute;

width:6px;
height:6px;

border-radius:50%;

background:#00ffae;

box-shadow:
0 0 15px #00ffae;


animation:
float 10s linear infinite;

}



@keyframes float{


0%{

transform:translateY(100vh);

opacity:0;

}


50%{

opacity:1;

}


100%{

transform:translateY(-20vh);

opacity:0;

}

}




/* SHOOTING STARS */


.shooting-star{

position:absolute;

width:130px;

height:2px;


background:
linear-gradient(
90deg,
transparent,
#00ffae,
white
);


box-shadow:
0 0 15px #00ffae;


opacity:0;

}



.left{

animation:
leftShoot 5s infinite;

}


.right{

animation:
rightShoot 5s infinite;

}



@keyframes leftShoot{


0%{

left:-150px;
top:20%;
opacity:0;

}

10%{
opacity:1;
}


100%{

left:45%;
top:70%;
opacity:0;

}

}




@keyframes rightShoot{


0%{

right:-150px;
top:25%;
opacity:0;

}

10%{
opacity:1;
}


100%{

right:45%;
top:65%;
opacity:0;

}

}





.container{

width:420px;

z-index:5;

}



.logo{

font-size:30px;

font-weight:bold;

display:flex;

gap:15px;

margin-bottom:25px;

}


.logo b{

color:#00e89d;

}





.card{

background:

rgba(12,25,35,.80);


padding:35px;


border-radius:25px;


border:

1px solid rgba(0,255,170,.3);


backdrop-filter:blur(20px);


box-shadow:

0 0 40px rgba(0,255,170,.2);

animation:
show .7s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}


to{

opacity:1;

transform:translateY(0);

}

}




h1{

font-size:32px;

}



p{

color:#9daab5;

margin:10px 0 25px;

font-size:14px;

}




label{

display:block;

margin-top:15px;

font-size:14px;

}



input{

width:100%;

padding:14px;

margin-top:7px;

border:none;

outline:none;

border-radius:12px;

background:#172633;

color:white;

}



button{


width:100%;


padding:15px;


margin-top:25px;


border:none;


border-radius:30px;


background:#00c982;


color:white;


font-size:16px;


font-weight:bold;


cursor:pointer;


}



button:hover{


background:#00ffae;


color:#00352b;


box-shadow:

0 0 30px #00ffae;


}




.links{

display:flex;

justify-content:space-between;

margin-top:25px;

}



.links a{

color:#00e89d;

cursor:pointer;

font-size:14px;

}



.page{

display:none;

}


.active{

display:block;

}




.admin{

border-color:#ffc400;

}


.admin button{

background:#ffc400;

color:black;

}


</style>

</head>



<body>



<div class="atom"></div>

<div class="atom two"></div>



<script>


for(let i=0;i<40;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"%";

p.style.animationDelay=Math.random()*10+"s";

p.style.animationDuration=(6+Math.random()*8)+"s";

document.body.appendChild(p);

}


</script>




<!-- Shooting Stars -->

<div class="shooting-star left"></div>

<div class="shooting-star right"></div>

<div class="shooting-star left" style="animation-delay:1s"></div>

<div class="shooting-star right" style="animation-delay:2s"></div>

<div class="shooting-star left" style="animation-delay:4s"></div>







<div class="container">


<div class="logo">

🚖

<span>

TODA<br>

<b>SYSTEM</b>

</span>

</div>





<!-- USER LOGIN -->


<div class="card page active" id="login">


<h1>
Welcome Back
</h1>


<p>
Transport Operations and Driver Association System
</p>



<label>Email</label>

<input id="loginEmail" type="text" placeholder="Email">



<label>Password</label>

<input id="loginPass" type="password" placeholder="Password">



<button onclick="memberLogin()"> LOGIN </button>



<div class="links">


<a onclick="showPage('signup')">

Create Account

</a>


<a onclick="showPage('admin')">

Admin Login

</a>


</div>


</div>









<!-- SIGN UP -->


<div class="card page" id="signup">


<h1>
Create Account
</h1>


<p>
Register Driver Member
</p>


<label>
Full Name
</label>

<input id="suName">



<label>
Phone Number
</label>

<input id="suPhone">



<label>
Email
</label>

<input id="suEmail">



<label>
Password
</label>

<input id="suPass" type="password">


<button onclick="registerMember()"> REGISTER </button>



<div class="links">

<a onclick="showPage('login')">

Back Login

</a>

</div>


</div>









<!-- ADMIN -->


<div class="card page admin" id="admin">


<h1>
Administrator
</h1>


<p>
TODA Management Portal
</p>



<label>
Username
</label>


<input id="adminUser" type="text" placeholder="Username">



<label>
Password
</label>


<input id="adminPass" type="password" placeholder="Password">



<button onclick="adminLogin()">

ADMIN LOGIN

</button>



<div class="links">


<a onclick="showPage('login')">

Back

</a>


</div>


</div>






</div>








<script>
function showPage(page) {
    document.querySelectorAll(".page").forEach(function (x) {
        x.classList.remove("active");
    });
    document.getElementById(page).classList.add("active");
}
function adminLogin() {
    const user = document.getElementById("adminUser").value;
    const pass = document.getElementById("adminPass").value;
    if (user === "AdminToda" && pass === "admin 123") {
        TODA.setSession("admin", "Administrator", "");
        location.href = "DashboardTODA.html";
    } else {
        alert("Invalid Admin Account!");
    }
}
function needFirebase() {
    if (!TODA.ready || !TODA.auth) {
        alert("Firebase is not configured yet. Fill in firebase-config.js first.");
        return true;
    }
    return false;
}
function authMessage(error) {
    const map = {
        "auth/invalid-credential": "Wrong email or password.",
        "auth/invalid-email": "Invalid email address.",
        "auth/email-already-in-use": "This email is already registered.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/user-not-found": "No account found for this email.",
        "auth/wrong-password": "Wrong email or password."
    };
    return map[error.code] || error.message;
}
function memberLogin() {
    if (needFirebase()) return;
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPass").value;
    if (!email || !pass) {
        alert("Please enter your email and password.");
        return;
    }
    TODA.auth.signInWithEmailAndPassword(email, pass).then(function (cred) {
        const name = cred.user.displayName || email.split("@")[0];
        TODA.setSession("member", name, email);
        location.href = "DBuser.html";
    }, function (error) {
        alert(authMessage(error));
    });
}
function registerMember() {
    if (needFirebase()) return;
    const name = document.getElementById("suName").value.trim();
    const phone = document.getElementById("suPhone").value.trim();
    const email = document.getElementById("suEmail").value.trim();
    const pass = document.getElementById("suPass").value;
    if (!name || !phone || !email || !pass) {
        alert("Please fill in all fields.");
        return;
    }
    TODA.auth.createUserWithEmailAndPassword(email, pass).then(function (cred) {
        return cred.user.updateProfile({ displayName: name }).then(function () {
            return TODA.addDriver({ name: name, contact: phone, email: email });
        });
    }).then(function (driver) {
        alert("Registered! Your TODA number is " + driver.todaNumber + ". An administrator must activate your account.");
        showPage("login");
    }, function (error) {
        alert(authMessage(error));
    });
}
</script>



</body>

</html>
